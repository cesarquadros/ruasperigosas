name: Build e Release

# - Pull request (aberto, atualizado ou reaberto): compila o APK como artefato. Não publica nada.
# - Merge na main (push): compila e cria a release com o APK anexado.
# Também compila o AAB assinado (pacote da Play Store) e o anexa à release.
# Commits em branches sem pull request não disparam nada.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  versao:
    name: Calcular versão
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versão
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ultima=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)
          ultima=${ultima:-v0.0.0}
          IFS=. read -r MA MI PA <<< "${ultima#v}"
          branch=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # O commit de merge traz a branch na mensagem ("Merge pull request #N from dono/branch").
            # É mais confiável que a API, que pode ainda não ter associado o commit ao PR.
            branch=$(git log -1 --format=%s "$GITHUB_SHA" | sed -n 's|^Merge pull request #[0-9]* from [^/]*/||p')
            if [ -z "$branch" ]; then
              for tentativa in 1 2 3 4 5; do
                branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""' || true)
                [ -n "$branch" ] && break
                sleep 5
              done
            fi
            # feature/* sobe a versão menor; qualquer outro prefixo (fix, doc, ci...) sobe o patch.
            case "$branch" in
              feature/*) MI=$((MI+1)); PA=0 ;;
              *) PA=$((PA+1)) ;;
            esac
            versao="$MA.$MI.$PA"
          else
            versao="${ultima#v}-pr.${{ github.event.pull_request.number }}.$GITHUB_RUN_NUMBER"
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "Última tag: $ultima | branch do PR: ${branch:-n/d} | versão: $versao"

  apk:
    name: Compilar APK
    needs: versao
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar templates de exportação
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configurar Java, Android SDK e keystore de debug
        shell: bash
        run: |
          set -e
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "JAVA_PATH=$JAVA_PATH"
          echo "SDK_PATH=$SDK_PATH"

          # Keystore de debug (a imagem já traz um; cria só se faltar)
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

          # Garante que o arquivo de configurações do editor existe
          godot --headless -e --quit || true
          echo "HOME=$HOME"
          SETTINGS="$(ls "$HOME"/.config/godot/editor_settings-4*.tres | head -n 1)"
          echo "SETTINGS=$SETTINGS"

          sed -i '/^export\/android\//d' "$SETTINGS"
          {
            echo "export/android/java_sdk_path = \"$JAVA_PATH\""
            echo "export/android/android_sdk_path = \"$SDK_PATH\""
            echo "export/android/debug_keystore = \"/root/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"

      - name: Aplicar versão no preset de exportação
        run: |
          sed -i "s|^version/name=.*|version/name=\"${VERSAO}\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          grep '^version/' export_presets.cfg

      - name: Importar recursos
        run: godot --headless --verbose --import || true

      - name: Exportar APK
        run: |
          mkdir -v -p dist
          godot --headless --verbose --export-debug "Android" "$(pwd)/dist/rua-de-fogo-v${VERSAO}.apk"

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: rua-de-fogo-apk
          path: dist/*.apk
          if-no-files-found: error

  aab:
    name: Compilar AAB (Play Store)
    needs: versao
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar templates de exportação
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configurar Java, Android SDK e keystores
        shell: bash
        run: |
          set -e
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(which keytool)")")")"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "JAVA_PATH=$JAVA_PATH"
          echo "SDK_PATH=$SDK_PATH"
          java -version
          ls "$SDK_PATH" "$SDK_PATH/platforms" "$SDK_PATH/build-tools" 2>&1 || true

          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

          # Keystore de release: a de verdade (segredos do repositório) ou uma temporária
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /root/release.keystore
            echo "ASSINATURA=chave de upload" >> "$GITHUB_ENV"
            echo "RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            keytool -keyalg RSA -genkeypair -alias temp -keypass temporaria \
              -keystore /root/release.keystore -storepass temporaria \
              -dname "CN=Temporaria,O=Teste,C=BR" -validity 9999 -deststoretype pkcs12
            echo "ASSINATURA=temporária (sem segredos configurados)" >> "$GITHUB_ENV"
            echo "RELEASE_USER=temp" >> "$GITHUB_ENV"
            echo "RELEASE_PASS=temporaria" >> "$GITHUB_ENV"
          fi

          godot --headless -e --quit || true
          SETTINGS="$(ls "$HOME"/.config/godot/editor_settings-4*.tres | head -n 1)"
          sed -i '/^export\/android\//d' "$SETTINGS"
          {
            echo "export/android/java_sdk_path = \"$JAVA_PATH\""
            echo "export/android/android_sdk_path = \"$SDK_PATH\""
            echo "export/android/debug_keystore = \"/root/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"

      - name: Instalar plataforma do Android alvo
        shell: bash
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          SDKM="$(ls "$SDK_PATH"/cmdline-tools/*/bin/sdkmanager "$SDK_PATH"/tools/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          echo "sdkmanager: ${SDKM:-não encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$SDK_PATH" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$SDK_PATH" "platforms;android-${TARGET_SDK}" "build-tools;35.0.0" "platform-tools"
          fi
        env:
          TARGET_SDK: "36"

      - name: Preparar build Gradle e preset de AAB
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          sed -i "s|^version/name=.*|version/name=\"${VERSAO}\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^gradle_build/use_gradle_build=.*|gradle_build/use_gradle_build=true|" export_presets.cfg
          sed -i "s|^gradle_build/export_format=.*|gradle_build/export_format=1|" export_presets.cfg
          sed -i "s|^gradle_build/target_sdk=.*|gradle_build/target_sdk=\"36\"|" export_presets.cfg
          # compila com o SDK 36 também
          sed -i "s|compileSdk = .*|compileSdk = 36|; s|compileSdkVersion = .*|compileSdkVersion = 36|" android/build/config.gradle || true
          grep -n "Sdk\|buildTools" android/build/config.gradle || true
          grep '^version/\|^gradle_build/' export_presets.cfg

      - name: Importar recursos
        run: godot --headless --verbose --import || true

      - name: Exportar AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/release.keystore
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$RELEASE_USER"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_PASS"
          echo "Assinatura: $ASSINATURA"
          mkdir -v -p dist
          godot --headless --verbose --export-release "Android" "$(pwd)/dist/rua-de-fogo-v${VERSAO}.aab"
          ls -la dist

      - name: Guardar AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: rua-de-fogo-aab
          path: dist/*.aab
          if-no-files-found: error

  release:
    name: Criar release
    if: github.event_name == 'push'
    needs: [versao, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rua-de-fogo-apk
          path: dist

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.versao.outputs.versao }}" dist/*.apk
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "v${{ needs.versao.outputs.versao }}"
          --generate-notes

  anexar-aab:
    name: Anexar AAB à release
    if: github.event_name == 'push'
    needs: [versao, release, aab]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rua-de-fogo-aab
          path: dist

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.versao.outputs.versao }}" dist/*.aab --repo "$GITHUB_REPOSITORY"
